services:
  - type: web
    name: aicte-fdr-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AICTE_ENV
        value: demo
      - key: AICTE_DATA_DIR
        value: /tmp/aicte_data
      - key: AICTE_BERT_ENABLED
        value: "0"
